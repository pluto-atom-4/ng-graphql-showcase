name: Type Check

on:
  pull_request:
    paths:
      - "frontend/**/*.ts"
      - "frontend/tsconfig.json"
      - "frontend/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/type-check.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**/*.ts"
      - "frontend/tsconfig.json"
      - "frontend/package.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/workflows/type-check.yml"

jobs:
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Type Check
        run: pnpm --filter frontend run type-check

      - name: Report Results
        if: always()
        run: |
          echo "Type check workflow completed"
          echo "Frontend type-check: ${{ job.status }}"
