query GetBuildWorkflowHistory($buildId: UUID!) {
  buildWorkflowHistory(buildId: $buildId) {
    id
    workflowInstanceId
    buildId
    eventType
    activityName
    oldStatus
    newStatus
    stateSnapshot
    errorMessage
    recordedAt
    executionStarted
    executionCompleted
    elapsedMilliseconds
  }
}

query GetRecentWorkflowHistory($days: Int = 7) {
  recentWorkflowHistory(days: $days) {
    id
    workflowInstanceId
    buildId
    eventType
    activityName
    oldStatus
    newStatus
    stateSnapshot
    errorMessage
    recordedAt
    executionStarted
    executionCompleted
    elapsedMilliseconds
  }
}
